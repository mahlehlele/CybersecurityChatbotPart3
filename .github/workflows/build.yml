name: Build WPF POE

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore packages
        run: dotnet restore CybersecurityChatbot.sln

      - name: Build WPF project
        run: dotnet build CybersecurityChatbot.sln --configuration Release --no-restore

      - name: Validate required POE files
        shell: pwsh
        run: ./Scripts/validate-submission.ps1
