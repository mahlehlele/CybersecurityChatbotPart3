name: Build WPF POE

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build WPF project
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore packages
        run: dotnet restore CybersecurityChatbot.sln

      - name: Build solution
        run: dotnet build CybersecurityChatbot.sln --configuration Release --no-restore

      - name: Validate required submission files
        shell: pwsh
        run: ./Scripts/validate-submission.ps1
